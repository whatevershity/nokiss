<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile hero — pies pod różem</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; }
    img {
      display: block;
      width: min(100vw, calc(100vh * 1535 / 3256));
      height: 100%;
      margin: 0 auto;
      object-fit: cover;
      object-position: center top;
    }
  </style>
</head>
<body>
  <img src="mobile-dog-under-pink.png" alt="Pies między zielonym a różowym, dół pod różem">
</body>
</html>
