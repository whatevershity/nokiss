<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nie cmokać na psa — krótki przewodnik po dobrym zachowaniu wobec psów.">
  <title>Nie cmokać na psa!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inconsolata:wght@400;700&family=Oswald:wght@300;400;500;600;700&family=Sarpanch:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="start">
    <section class="phone-hero" aria-labelledby="hero-title">
      <nav class="phone-nav" aria-label="Główna nawigacja">
        <a href="#jedz">JEDZ</a>
        <a href="#kamieni">KAMIENI,</a>
        <a href="#en" class="lang-link" hreflang="en" lang="en" title="English version"><span>WOOF?</span></a>
      </nav>

      <div class="title-stack">
        <h1 class="hero-title" id="hero-title">
          <span class="chip chip-nie">
            <span class="n-big">N</span><span class="ie">I</span><span class="ie">E</span>
          </span>
          <span class="chip chip-cmokac">
            <span class="c">C</span><span class="m-big">M</span><span class="o">O</span><span class="k">K</span><span class="a-ogonek">A</span><span class="c-kreska">Ć</span>
          </span>
          <span class="chip chip-napsa">
            <span class="n">N</span><span class="a">A</span><span class="p">P</span><span class="s">S</span><span class="a-big">A</span>
          </span>
        </h1>
      </div>

      <div class="hero-dog">
        <img src="hero-dog.png" alt="Przyjazny pies patrzący w górę">
      </div>

      <section class="hero-copy" aria-label="Wstęp">
        <p class="hero-question">
          <span class="q-line">KOCHASZ PSY I GDY JE WIDZISZ</span>
          <span class="q-line">CHCESZ JE TULIĆ I GŁASKAĆ,</span>
          <span class="q-line">CAŁOWAĆ I JESZCZE <span class="spaced">C A Ł O</span></span>
          <span class="q-line q-last"><span class="spaced">W A Ć</span>&nbsp;?</span>
        </p>
        <p class="stop-wrap">
          <span class="stop">STO P!</span>
          <span class="stop-caption">[P JAK PIES]</span>
        </p>
      </section>
    </section>
  </main>
</body>
</html>
